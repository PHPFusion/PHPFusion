<div class="mp-item-content canvas">
	{item.{
	<div class="panel panel-addons">
		<a href="{%link%}">
			<div class="overflow-hide" style="max-height:180px;">
				{%image%}
			</div>
			<div class="panel-body">
				<h5 class="title">{%title%}</h5>
				<p class="description">
					{%description%}
				</p>
			</div>
			<div class="panel-footer">
				<div class="meta">
					{%price%}<br/>
					<img src="{%store_logo_path%}" class="icon-xs m-r-5">{%profile_link%}
				</div>
				<div class="info">
					{%ratings_text%}<br/>
					{%download_text%}<br/>
					{%collection_text%}<br/>
				</div>
			</div>
		</a>
	</div>
	}}
	{all.{
	<div class="panel panel-addons all">
		<a href="{%link%}">
			<div class="panel-body">
				<h5 class="title">See all items</h5>
			</div>
		</a>
	</div>
	}}
</div>
