<div class="panel-wrapper">
	<span class="action-link pull-right text-uppercase">
		{edit.{
		<a class="text-primary bold m-r-10" href="{%link%}" data-toggle="edit" data-value="{%panel_name%}"><i class="fad fa-pencil"></i> Edit</a>
		}}
		{more.{
		<a href="{%link%}" class="text-white bold" data-toggle="more" data-value="{%panel_name%}">More</a>
		}}
	</span>
	<h4>{%panel_title%}</h4>
	{%panel_content%}
</div>
